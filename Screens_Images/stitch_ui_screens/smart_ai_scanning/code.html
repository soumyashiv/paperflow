<body class="bg-background text-on-background h-screen w-full flex flex-col font-body-md overflow-hidden relative">
<!-- Top Navigation (Suppressed per Nav Logic for Transactional/Onboarding, replacing with a simple Skip button) -->
<header class="w-full flex justify-end items-center px-container-padding py-4 z-10 absolute top-0">
<button class="font-label-lg text-label-lg text-on-surface-secondary hover:text-on-surface transition-colors">
            Skip
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-container-padding relative z-0">
<!-- Illustration Container -->
<div class="w-full max-w-sm aspect-square mb-stack-gap-lg relative rounded-2xl overflow-hidden shadow-card border border-outline-variant bg-surface-container-lowest">
<img class="w-full h-full object-cover" data-alt="A clean, modern illustration in a light-mode aesthetic showing a smartphone scanning a physical document. The design features soft, organic shapes and a warm, sophisticated palette of pristine whites, subtle earthy beiges, and focused golden-yellow accents. The document being scanned glows slightly, emphasizing intelligent capture technology." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAND31jvoMvjT-9NMTbnMbTcKO6__6Plg3GS_jWlSeZpwhAanolwq5OpdNSgu6pVnN_MgSYwTMbEyUrHVHUL6KjPKtOH4cQLYeA8QIVVaOYKY-ckdYkSkew1Zj1QsGFuulyu5FnoBy7AukrbpZOFZlvbqL4bRYbc_5Ntq9zdcpFHRe_nTIcaOVHVh5K4_vn6_VrmQPObBC0zTUd6SO2iZuQarYfiRXEWsLdZPNXy0lgoHvJXlCpNobdHPIqx851k5kcpl2Va-ODwLun">
<!-- Decorative scan line overlay -->
<div class="absolute inset-x-0 h-0.5 bg-primary opacity-50 top-1/2 animate-[scan_2s_ease-in-out_infinite]" style="box-shadow: 0 0 8px rgba(116, 91, 0, 0.5);"></div>
<style>
                @keyframes scan {
                    0% { top: 10%; opacity: 0; }
                    20% { opacity: 0.8; }
                    80% { opacity: 0.8; }
                    100% { top: 90%; opacity: 0; }
                }
            </style>
</div>
<!-- Text Content -->
<div class="text-center w-full max-w-sm mb-stack-gap-lg">
<h1 class="font-display-lg text-display-lg text-on-surface mb-stack-gap-sm">Intelligent Capture</h1>
<p class="font-body-md text-body-md text-on-surface-secondary">
                Our Smart AI Scanning automatically detects edges, crops perfectly, and enhances text clarity for pristine digital documents in seconds.
            </p>
</div>
<!-- Bottom Controls -->
<div class="w-full max-w-sm flex items-center justify-between mt-auto mb-8 px-element-padding-x">
<!-- Pagination Dots -->
<div class="flex gap-2">
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-8 h-2 rounded-full bg-primary"></div> <!-- Active dot -->
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
</div>
<!-- Next Button -->
<button class="bg-primary text-on-primary font-label-lg text-label-lg px-6 py-element-padding-y rounded-full shadow-sm hover:opacity-90 transition-opacity flex items-center gap-2">
                Next
                <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
</button>
</div>
</main>
