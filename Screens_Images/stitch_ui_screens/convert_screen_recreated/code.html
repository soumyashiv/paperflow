<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Convert</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
    @layer utilities {
      .bg-surface { background-color: #fff8f1; }
      .bg-primary { background-color: #ffcc0f; }
      .text-on-primary { color: #000000; }
      .rounded-base { border-radius: 8px; }
    }
    
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" data-snapdom="injected-import"></head>
<body class="bg-surface text-gray-900 antialiased h-screen flex flex-col pt-12 pb-8">
<!-- BEGIN: Header -->
<header class="flex items-center justify-between px-4 py-3">
<button aria-label="Go back" class="p-2 -ml-2 text-gray-800">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-xl font-semibold flex-1 ml-2 text-gray-900">Convert</h1>
<button aria-label="Search" class="p-2 -mr-2 text-gray-800">
<span class="material-symbols-outlined">search</span>
</button>
</header>
<!-- END: Header -->
<!-- BEGIN: Main Content -->
<main class="flex-1 overflow-y-auto px-4 py-2 space-y-4">
<!-- BEGIN: From Section -->
<section class="bg-white rounded-2xl p-4 shadow-sm" data-purpose="source-format">
<h2 class="text-sm text-gray-700 mb-3">From</h2>
<button class="w-full flex items-center justify-between py-1">
<div class="flex items-center gap-3">
<div class="w-8 h-8 flex items-center justify-center rounded bg-red-100 text-red-500">
<span class="material-symbols-outlined text-xl">picture_as_pdf</span>
</div>
<span class="font-medium text-gray-900">PDF</span>
</div>
<span class="material-symbols-outlined text-gray-400 text-xl">chevron_right</span>
</button>
</section>
<!-- END: From Section -->
<!-- BEGIN: To Section -->
<section class="bg-white rounded-2xl p-4 shadow-sm" data-purpose="target-formats">
<h2 class="text-sm text-gray-700 mb-4">To</h2>
<div class="grid grid-cols-4 gap-y-6 gap-x-2"><!-- PDF -->
<button class="flex flex-col items-center justify-center gap-2 group">
<div class="w-12 h-12 rounded-xl bg-gray-50 flex items-center justify-center group-hover:bg-gray-100 transition-colors">
<span class="material-symbols-outlined text-gray-700 text-2xl">description</span>
</div>
<span class="text-xs text-gray-800 font-medium text-center">PDF</span>
</button>
<!-- Word -->
<button class="flex flex-col items-center justify-center gap-2 group">
<div class="w-12 h-12 rounded-xl bg-blue-50 flex items-center justify-center group-hover:bg-blue-100 transition-colors">
<span class="material-symbols-outlined text-blue-500 text-2xl">article</span>
</div>
<span class="text-xs text-gray-800 font-medium text-center">Word</span>
</button>
<!-- Text -->
<button class="flex flex-col items-center justify-center gap-2 group">
<div class="w-12 h-12 rounded-xl bg-gray-50 flex items-center justify-center group-hover:bg-gray-100 transition-colors">
<span class="material-symbols-outlined text-gray-700 text-2xl">text_fields</span>
</div>
<span class="text-xs text-gray-800 font-medium text-center">Text</span>
</button>
<!-- Empty Slot -->
<div></div>
<!-- Excel -->
<button class="flex flex-col items-center justify-center gap-2 group">
<div class="w-12 h-12 rounded-xl bg-green-50 flex items-center justify-center group-hover:bg-green-100 transition-colors">
<span class="material-symbols-outlined text-green-500 text-2xl">table</span>
</div>
<span class="text-xs text-gray-800 font-medium text-center">Excel</span>
</button>
<!-- PPT -->
<button class="flex flex-col items-center justify-center gap-2 group">
<div class="w-12 h-12 rounded-xl bg-orange-50 flex items-center justify-center group-hover:bg-orange-100 transition-colors">
<span class="material-symbols-outlined text-orange-500 text-2xl">slideshow</span>
</div>
<span class="text-xs text-gray-800 font-medium text-center">PPT</span>
</button>
<!-- Image -->
<button class="flex flex-col items-center justify-center gap-2 group">
<div class="w-12 h-12 rounded-xl bg-gray-50 flex items-center justify-center group-hover:bg-gray-100 transition-colors">
<span class="material-symbols-outlined text-gray-700 text-2xl">image</span>
</div>
<span class="text-xs text-gray-800 font-medium text-center">Image</span>
</button></div>
</section>
<!-- END: To Section -->
<!-- BEGIN: Options Section -->
<section class="bg-white rounded-2xl p-4 shadow-sm space-y-4" data-purpose="conversion-options">
<h2 class="text-sm text-gray-700">Options</h2>
<div class="flex items-center justify-between">
<label class="text-[15px] text-gray-900" for="ocr-toggle">OCR (Make text searchable)</label>
<button aria-checked="true" class="w-12 h-6 bg-green-500 rounded-full relative transition-colors" id="ocr-toggle" role="switch">
<span class="absolute right-1 top-1 w-4 h-4 bg-white rounded-full shadow-sm"></span>
</button>
</div>
<div class="flex items-center justify-between">
<label class="text-[15px] text-gray-900" for="layout-toggle">Keep layout</label>
<button aria-checked="true" class="w-12 h-6 bg-green-500 rounded-full relative transition-colors" id="layout-toggle" role="switch">
<span class="absolute right-1 top-1 w-4 h-4 bg-white rounded-full shadow-sm"></span>
</button>
</div>
</section>
<!-- END: Options Section -->
<!-- BEGIN: OCR Language Section -->
<section class="bg-white rounded-2xl p-4 shadow-sm" data-purpose="ocr-language">
<h2 class="text-sm text-gray-700 mb-2">OCR Language</h2>
<button class="w-full flex items-center justify-between py-1">
<span class="text-[15px] text-gray-900">English (Automatic)</span>
<span class="material-symbols-outlined text-gray-400 text-xl">chevron_right</span>
</button>
</section>
<!-- END: OCR Language Section -->
</main>
<!-- END: Main Content -->
<!-- BEGIN: Bottom Action -->
<div class="px-4 pt-4 pb-6 mt-auto">
<button class="w-full bg-primary text-on-primary font-semibold py-4 rounded-xl shadow-sm active:opacity-90 transition-opacity">
      Convert
    </button>
</div>
<!-- END: Bottom Action -->


</body></html>
