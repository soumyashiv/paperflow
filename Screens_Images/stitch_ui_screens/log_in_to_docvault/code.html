<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col justify-center items-center py-12 px-4 sm:px-6 lg:px-8">
<!-- Ambient Background Effect -->

<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-primary-container opacity-20 blur-[120px]"></div>

<!-- Login Container -->

<!-- Header Section -->
<header class="text-center flex flex-col items-center gap-4 mb-2">
<div class="w-16 h-16 bg-primary-container rounded-2xl flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-primary-container" data-icon="folder_open" style="font-size: 32px;">folder_open</span>
</div>
<div>
<h1 class="font-display-lg text-display-lg text-on-surface">PaperFlow</h1>
<p class="font-body-md text-body-md text-on-surface-secondary mt-1">Sign in to your workspace</p>
</div>
</header>
<!-- Social Login Grid (Bento Style) -->


<!-- Form Section -->
<form class="flex flex-col gap-stack-gap-sm">
<!-- Email Input -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="mail" style="font-size: 20px;">mail</span>
</div>
<input class="block w-full pl-11 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-xl text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary placeholder:text-on-surface-variant/50 transition-shadow" id="email" name="email" placeholder="you@company.com" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1.5 mt-2">
<div class="flex justify-between items-center ml-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed-dim transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="lock" style="font-size: 20px;">lock</span>
</div>
<input class="block w-full pl-11 pr-11 py-3 bg-surface-container-lowest border border-outline-variant rounded-xl text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary placeholder:text-on-surface-variant/50 transition-shadow" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off" style="font-size: 20px;">visibility_off</span>
</button>
</div>
</div>

<script>
        // Simple script to toggle password visibility (for interactive feel)
        document.addEventListener('DOMContentLoaded', () => {
            const togglePasswordBtn = document.querySelector('button:has([data-icon="visibility_off"])');
            if(togglePasswordBtn) {
                togglePasswordBtn.addEventListener('click', function() {
                    const input = document.getElementById('password');
                    const icon = this.querySelector('span');
                    
                    if (input.type === 'password') {
                        input.type = 'text';
                        icon.textContent = 'visibility';
                        icon.setAttribute('data-icon', 'visibility');
                    } else {
                        input.type = 'password';
                        icon.textContent = 'visibility_off';
                        icon.setAttribute('data-icon', 'visibility_off');
                    }
                });
            }
        });
    </script>
