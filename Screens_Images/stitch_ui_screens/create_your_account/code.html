<body class="bg-surface-container-lowest text-on-surface min-h-full flex flex-col font-body-md antialiased">
<!-- Note: TopAppBar suppressed for transactional/onboarding flow per JSON logic -->
<main class="flex-grow flex items-center justify-center px-container-padding py-stack-gap-lg">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-card border border-outline-variant p-stack-gap-md sm:p-stack-gap-lg">
<div class="text-center mb-stack-gap-lg">
<h1 class="font-display-lg text-display-lg text-primary mb-2">PaperFlow</h1>
<p class="font-body-md text-body-md text-on-surface-secondary">Create an account to securely manage your documents.</p>
</div>
<form action="#" class="space-y-stack-gap-sm" method="POST">
<!-- Full Name Field -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-1" for="name">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-element-padding-y border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:ring-primary focus:border-primary placeholder-on-surface-variant transition-colors" id="name" name="name" placeholder="Jane Doe" required="" type="text">
</div>
</div>
<!-- Email Field -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-1" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-element-padding-y border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:ring-primary focus:border-primary placeholder-on-surface-variant transition-colors" id="email" name="email" placeholder="jane@example.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-1" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-element-padding-y border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:ring-primary focus:border-primary placeholder-on-surface-variant transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
<p class="mt-1 font-body-sm text-body-sm text-on-surface-secondary">Must be at least 8 characters long.</p>
</div>
<!-- Submit Button -->
<div class="pt-stack-gap-sm">
<button class="w-full flex justify-center py-element-padding-y px-element-padding-x border border-transparent rounded-lg shadow-sm font-label-lg text-label-lg text-on-primary bg-primary hover:bg-surface-tint focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors" type="submit">
                        Sign Up
                    </button>
</div>
</form>
<div class="mt-stack-gap-lg">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-container-lowest font-body-sm text-body-sm text-on-surface-secondary">Or continue with</span>
</div>
</div>

<div class="mt-stack-gap-sm">
  <button class="w-full flex items-center justify-center gap-2 py-element-padding-y px-element-padding-x border border-outline-variant rounded-lg shadow-sm font-label-lg text-label-lg text-on-surface bg-surface-container-lowest hover:bg-surface-container-low focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors" type="button">
